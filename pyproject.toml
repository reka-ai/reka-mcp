[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reka-mcp"
version = "0.1.5"
description = "Official Reka MCP server for video understanding"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Reka AI" },
]
maintainers = [
    { name = "Reka AI", email = "dev@reka.ai" },
]
keywords = [
    "reka",
    "mcp",
    "model-context-protocol",
    "video",
    "vision",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://www.reka.ai"
Repository = "https://github.com/reka-ai/reka-mcp"
Issues = "https://github.com/reka-ai/reka-mcp/issues"
Documentation = "https://docs.reka.ai/mcp"

[project.scripts]
reka-mcp = "reka_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reka_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "twine>=6.2",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["reka_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
